# C formatting rules.
# add: require whitespace, preserving extra spaces.
# force: require exactly one space/newline; remove: delete it; ignore: preserve it.
# Full option documentation: uncrustify --show-config
# Apply: uncrustify -c uncrustify.cfg --replace --no-backup FILE

# Indentation
indent_columns = 8                    # Eight spaces per block level.
indent_with_tabs = 0                  # Use spaces, not tabs.

# Assignment operators
sp_assign = force                    # Exactly one space on each side of assignments.

# Space before '('
sp_func_call_paren = add              # Function and macro calls: function (...).
sp_func_def_paren = add               # Function definitions.
sp_func_proto_paren = add             # Preserve manual '(' column alignment in declarations.

# GNU named variadic macro parameters: format...
sp_before_ellipsis = remove           # Keep the ellipsis attached to the parameter name.

# Variable and parameter pointers: char *name, char **names.
sp_after_type = add                   # Require separation while preserving manual alignment.
sp_before_ptr_star = add              # Separate the type from '*'.
sp_after_ptr_star = remove            # Attach '*' to the variable name.
sp_between_ptr_star = remove          # Keep multiple stars together: **.
sp_ptr_star_func_var = remove         # Function-pointer variables: (*callback).
sp_ptr_star_func_type = remove        # Function-pointer typedefs: (*Callback).

# Array declarations and indexing: name[], name[index].
sp_before_square = remove             # No space before a non-empty '['.
sp_before_squares = remove            # No space before '[]'.
sp_before_vardef_square = remove      # Apply the same rule to variable definitions.

# Return pointers and declaration alignment: Type * function (...).
sp_before_ptr_star_func = force       # Exactly one space between return type and '*' or '**'.
sp_after_ptr_star_func = add          # Separate return stars from the name; preserve existing padding.
align_func_proto_star_style = 0        # Keep return stars with the type; align names after them.
align_func_proto_span = 3             # Align function names in nearby declarations.
align_func_proto_span_ignore_cont_lines = true # Exclude continuation lines from that span.
align_func_proto_gap = 1              # At least one space between return type and name.

# GObject type macros.
set ATTRIBUTE G_DEFINE_TYPE           # Keep argument indentation and recognize following functions.
set ATTRIBUTE G_DECLARE_FINAL_TYPE G_DECLARE_DERIVABLE_TYPE # Recognize prototypes following type declarations.

# Function parameters: one per line, with aligned types and names.
nl_func_def_args = force              # Split definition parameters, not call arguments.
nl_func_decl_args = force             # Likewise for declarations.
align_func_params = true              # Align names in multiline parameter lists.
align_var_def_star_style = 2          # Exclude pointer stars when aligning variable/parameter names.
align_typedef_star_style = 2          # Apply the same rule to typedef names.
# Parameter columns reserve the widest type plus one space and the widest
# pointer-star group. Uncrustify cannot derive these two widths independently;
# align_keep_extra_space preserves this manually established padding.
align_keep_extra_space = true         # Preserve existing manual alignment spaces.

# Struct and union members are not column-aligned.
align_var_struct_span = 0             # Do not align member names across declarations.

# Control-flow braces: if (...) { ... } else { ... }.
sp_sparen_brace = add                 # Space between a control condition's ')' and '{'.
sp_do_brace_open = add                # Space in 'do {'.
sp_else_brace = add                   # Space in 'else {'.
sp_brace_else = add                   # Space in '} else'.
nl_if_brace = remove                  # Keep if/else-if '{' on the condition's line.
nl_else_brace = remove                # Keep 'else {' together.
nl_else_if = remove                   # Keep 'else if' together.
nl_for_brace = remove                 # Keep 'for (...) {' together.
nl_while_brace = remove               # Keep 'while (...) {' together.
nl_do_brace = remove                  # Keep 'do {' together.
nl_switch_brace = remove              # Keep 'switch (...) {' together.
nl_brace_else = remove                # Keep '} else' together.
nl_brace_while = remove               # Keep '} while (...)' together in do/while.

# Always require control-flow braces, even for single-statement bodies.
mod_full_brace_if = add               # Require braces for if, else-if, and else bodies.
mod_full_brace_for = add              # Require braces for for-loop bodies.
mod_full_brace_while = add            # Require braces for while-loop bodies.
mod_full_brace_do = add               # Require braces for do/while-loop bodies.

# Function definitions: return type above the name, brace on its own line.
nl_func_type_name = force             # Separate return types from function names, including static functions.
nl_fdef_brace = add                   # Put a function body's opening '{' on a new line.

# Gettext shortcuts are exceptions to ordinary call spacing.
set func_call_user _ C_ I_ N_ NC_ P_ Q_ # Give these names their own call-spacing rule.

# Avoid unrelated formatting changes.
pp_ignore_define_body = true          # Do not format macro replacement bodies.
cmt_indent_multi = false              # Leave multiline comment interiors alone.
